<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <img src="assets/otflow-logo.png" alt="OTFLOW Logistique">
      </div>
      <h2>Mot de passe oublié</h2>
      <p class="auth-subtitle">Entrez votre email pour recevoir un lien</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" [(ngModel)]="email" placeholder="Adresse Email" required>
        </div>
      </div>

      <div *ngIf="err" class="auth-error">
        <i class="fas fa-exclamation-circle"></i> {{error}}
      </div>
      
      <div *ngIf="successMsg" class="auth-success" style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #ecfdf5; border-radius: 10px; color: #059669; font-size: 0.85rem; font-weight: 500; border: 1px solid #d1fae5;">
        <i class="fas fa-check-circle"></i> {{successMsg}}
      </div>

      <button type="submit" class="auth-btn">
        <span>Envoyer le lien</span>
        <i class="fas fa-paper-plane"></i>
      </button>

      <div class="auth-footer">
        <span>Se souvenir du mot de passe ?</span>
        <a routerLink="/login">Retour à la connexion</a>
      </div>
    </form>
  </div>
</div>
