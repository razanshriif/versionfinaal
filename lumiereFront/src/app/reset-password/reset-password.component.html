<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <img src="assets/otflow-logo.png" alt="OTFLOW Logistique">
      </div>
      <h2>Nouveau mot de passe</h2>
      <p class="auth-subtitle">Entrez le code reçu et votre nouveau mot de passe</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" [(ngModel)]="email" placeholder="Adresse Email" required readonly style="background-color: #f3f4f6; color: #6b7280; cursor: not-allowed;">
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="text" name="code" [(ngModel)]="code" placeholder="Code à 6 chiffres" required>
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input [type]="showPassword ? 'text' : 'password'" name="newPassword" [(ngModel)]="newPassword" placeholder="Nouveau mot de passe" required>
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
      </div>

      <div *ngIf="err" class="auth-error">
        <i class="fas fa-exclamation-circle"></i> {{error}}
      </div>
      
      <div *ngIf="successMsg" class="auth-success" style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #ecfdf5; border-radius: 10px; color: #059669; font-size: 0.85rem; font-weight: 500; border: 1px solid #d1fae5;">
        <i class="fas fa-check-circle"></i> {{successMsg}}
      </div>

      <button type="submit" class="auth-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Réinitialiser</span>
        <i class="fas fa-spinner fa-spin" *ngIf="isLoading"></i>
        <i class="fas fa-arrow-right" *ngIf="!isLoading"></i>
      </button>

      <div class="auth-footer">
        <a routerLink="/login">Retour à la connexion</a>
      </div>
    </form>
  </div>
</div>
