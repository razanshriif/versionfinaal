<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Nouveau mot de passe</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding reset-content">
  <div class="header-section">
    <h2>Vérification</h2>
    <p>Veuillez entrer le code reçu par email et votre nouveau mot de passe.</p>
  </div>

  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">
    <div class="input-group">
      <ion-icon name="mail-outline" class="input-icon"></ion-icon>
      <ion-input type="email" formControlName="email" placeholder="Adresse Email" class="custom-input"></ion-input>
    </div>

    <div class="input-group">
      <ion-icon name="key-outline" class="input-icon"></ion-icon>
      <ion-input type="text" formControlName="code" placeholder="Code de validation à 6 chiffres" class="custom-input"></ion-input>
    </div>

    <div class="input-group">
      <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
      <ion-input [type]="showPassword ? 'text' : 'password'" formControlName="newPassword" placeholder="Nouveau mot de passe" class="custom-input"></ion-input>
      <ion-button fill="clear" class="eye-btn" (click)="togglePasswordVisibility()">
        <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
      </ion-button>
    </div>

    <ion-button expand="block" type="submit" [disabled]="resetForm.invalid || isLoading" class="submit-btn">
      <span *ngIf="!isLoading">Réinitialiser</span>
      <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
    </ion-button>
  </form>
</ion-content>
