<ion-content class="reset-content">
  <!-- Dynamic Background Bubbles -->
  <div class="bg-bubble b1"></div>
  <div class="bg-bubble b2"></div>
  <div class="bg-bubble b3"></div>

  <div class="reset-container">
    <div class="logo-section">
      <div class="logo-wrapper">
        <img src="assets/otflow-logo.png" alt="OTFLOW Logo" class="main-logo" />
        <div class="logo-glow"></div>
      </div>
      <h1 class="brand-title">OTFLOW</h1>
      <p class="brand-subtitle">VÉRIFICATION</p>
    </div>

    <div class="glass-card">
      <div class="card-header">
        <h2>Nouveau mot de passe</h2>
        <p>Entrez le code reçu et votre nouveau mot de passe</p>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">
        <div class="input-group">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <ion-input type="email" formControlName="email" placeholder="Adresse Email" class="custom-input"></ion-input>
        </div>

        <div class="input-group">
          <ion-icon name="key-outline" class="input-icon"></ion-icon>
          <ion-input type="text" formControlName="code" placeholder="Code à 6 chiffres" class="custom-input"></ion-input>
        </div>

        <div class="input-group">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <ion-input [type]="showPassword ? 'text' : 'password'" formControlName="newPassword" placeholder="Nouveau mot de passe" class="custom-input"></ion-input>
          <ion-button fill="clear" class="eye-btn" (click)="togglePasswordVisibility()">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </div>

        <ion-button expand="block" type="submit" [disabled]="resetForm.invalid || isLoading" class="submit-btn">
          <span *ngIf="!isLoading">Réinitialiser</span>
          <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
        </ion-button>
        
        <ion-button fill="clear" expand="block" class="back-btn" routerLink="/login">
          <ion-icon name="arrow-back-outline" slot="start"></ion-icon>
          Retour à la connexion
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
