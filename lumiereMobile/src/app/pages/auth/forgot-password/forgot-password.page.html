<ion-content class="forgot-content">
  <!-- Dynamic Background Bubbles -->
  <div class="bg-bubble b1"></div>
  <div class="bg-bubble b2"></div>
  <div class="bg-bubble b3"></div>

  <div class="forgot-container">
    <div class="logo-section">
      <div class="logo-wrapper">
        <img src="assets/otflow-logo.png" alt="OTFLOW Logo" class="main-logo" />
        <div class="logo-glow"></div>
      </div>
      <h1 class="brand-title">OTFLOW</h1>
      <p class="brand-subtitle">RÉINITIALISATION</p>
    </div>

    <div class="glass-card">
      <div class="card-header">
        <h2>Mot de passe oublié</h2>
        <p>Entrez votre email pour recevoir un lien</p>
      </div>

      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="forgot-form">
        <div class="input-group">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <ion-input type="email" formControlName="email" placeholder="Adresse Email" class="custom-input"></ion-input>
        </div>

        <ion-button expand="block" type="submit" [disabled]="forgotForm.invalid || isLoading" class="submit-btn">
          <span *ngIf="!isLoading">Envoyer le code</span>
          <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
        </ion-button>
        
        <ion-button fill="clear" expand="block" class="back-btn" routerLink="/login">
          <ion-icon name="arrow-back-outline" slot="start"></ion-icon>
          Retour à la connexion
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
