<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Mot de passe oublié</h2>
      <p class="auth-subtitle">Entrez votre email pour recevoir un code de réinitialisation</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" [(ngModel)]="email" placeholder="Adresse Email" required>
        </div>
      </div>

      <div *ngIf="error" class="auth-error" style="color: red; margin-bottom: 10px;">
        <i class="fas fa-exclamation-circle"></i> {{error}}
      </div>
      <div *ngIf="success" class="auth-success" style="color: green; margin-bottom: 10px;">
        <i class="fas fa-check-circle"></i> {{success}}
      </div>

      <button type="submit" class="auth-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Envoyer le code</span>
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Envoi...</span>
      </button>

      <div class="auth-footer">
        <a routerLink="/login">Retour à la connexion</a>
      </div>
    </form>
  </div>
</div>
