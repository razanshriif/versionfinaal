<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Nouveau mot de passe</h2>
      <p class="auth-subtitle">Saisissez le code reçu par email et votre nouveau mot de passe</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" [(ngModel)]="email" placeholder="Adresse Email" required>
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="text" name="code" [(ngModel)]="code" placeholder="Code à 6 chiffres" required>
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" name="newPassword" [(ngModel)]="newPassword" placeholder="Nouveau mot de passe" required>
        </div>
      </div>

      <div *ngIf="error" class="auth-error" style="color: red; margin-bottom: 10px;">
        <i class="fas fa-exclamation-circle"></i> {{error}}
      </div>
      <div *ngIf="success" class="auth-success" style="color: green; margin-bottom: 10px;">
        <i class="fas fa-check-circle"></i> {{success}}
      </div>

      <button type="submit" class="auth-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Réinitialiser</span>
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Traitement...</span>
      </button>

      <div class="auth-footer">
        <a routerLink="/login">Retour à la connexion</a>
      </div>
    </form>
  </div>
</div>
